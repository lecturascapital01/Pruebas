// ========== PARSEO DE COORDENADAS (FORMATO EMPRESARIAL) ==========
function parseCoordenada(str) {
  if (!str || typeof str !== 'string') return null;
  const trimmed = str.trim();
  const garminMatch = trimmed.match(/([NS])\s*(\d+)\s+([\d.]+)\s+([EW])\s*(\d+)\s+([\d.]+)/i);
  if (garminMatch) {
    const latDeg = parseInt(garminMatch[2]);
    const latMin = parseFloat(garminMatch[3]);
    let lat = latDeg + latMin / 60;
    if (garminMatch[1].toUpperCase() === 'S') lat = -lat;
    const lonDeg = parseInt(garminMatch[5]);
    const lonMin = parseFloat(garminMatch[6]);
    let lon = lonDeg + lonMin / 60;
    if (garminMatch[4].toUpperCase() === 'W') lon = -lon;
    if (!isNaN(lat) && !isNaN(lon)) return { lat, lon };
  }
  const decimalMatch = trimmed.match(/([+-]?\d+\.?\d*)\s*[,;\s]+\s*([+-]?\d+\.?\d*)/);
  if (decimalMatch) {
    const lat = parseFloat(decimalMatch[1]);
    const lon = parseFloat(decimalMatch[2]);
    if (!isNaN(lat) && !isNaN(lon)) return { lat, lon };
  }
  return null;
}

function toGarminFormat(lat, lon) {
  const latDir = lat >= 0 ? 'N' : 'S';
  const lonDir = lon >= 0 ? 'E' : 'W';
  const latAbs = Math.abs(lat);
  const lonAbs = Math.abs(lon);
  const latDeg = Math.floor(latAbs);
  const latMin = (latAbs - latDeg) * 60;
  const lonDeg = Math.floor(lonAbs);
  const lonMin = (lonAbs - lonDeg) * 60;
  return `${latDir}${latDeg} ${latMin.toFixed(3)} ${lonDir}${lonDeg} ${lonMin.toFixed(3)}`;
}

// ========== FUNCIONES DE PERSISTENCIA GLOBAL ==========
function saveProgress() {
  try {
    const progress = {};
    tasks.forEach(t => {
      if (t.numeroOT && t.numeroOT.trim() !== '') {
        progress[t.numeroOT] = t.status;
      }
    });
    localStorage.setItem('giot_progress_global', JSON.stringify(progress));
  } catch(e) { console.warn('Error guardando progreso:', e); }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem('giot_progress_global');
    if (!raw) return;
    const progress = JSON.parse(raw);
    tasks.forEach(t => {
      if (t.numeroOT && progress[t.numeroOT]) {
        t.status = progress[t.numeroOT];
      }
    });
  } catch(e) { console.warn('Error cargando progreso:', e); }
}

function saveFullState() {

    localStorage.setItem('giot_full_state', JSON.stringify(data));
  } catch(e) {}
}

function loadFullState() {
  try {
    const raw = localStorage.getItem('giot_full_state');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.tasks && data.tasks.length) {
      tasks = data.tasks;
      orden = data.orden || [];

      perfilRuteo = data.perfilRuteo || 'driving';

      document.getElementById('hud-panel').style.display = 'flex';
      document.getElementById('modalTitle').innerHTML = modoLectura ? '📋 Lista de Lecturas <span id="modalTotal">(0)</span>' : '📋 Lista de Trabajos <span id="modalTotal">(0)</span>';
      loadProgress();
      const activas = getActiveTasks();
      if (activas.length > 0 && orden.length !== activas.length) {
        console.warn('⚠️ Orden inconsistente al cargar. Reordenando...');
        reorderTasks();
      } else {
        renderTasks();
        updateNavigation();
        fitMapToFeatures();
      }
    }
  } catch(e) { console.warn('Error cargando estado:', e); }
}

// ========== PARSER DE ÓRDENES (con campo operario) ==========
function parseOrdenesTXT(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length < 2) return [];
  let sep = '\t';
  if (lines[0].includes(';')) sep = ';';
  else if (lines[0].includes(',')) sep = ',';
  const headers = lines[0].split(sep).map(h => h.trim());
  const findCol = (patterns) => {
    for (const p of patterns) {
      const idx = headers.findIndex(h => h.toLowerCase().trim() === p.toLowerCase().trim());
      if (idx !== -1) return idx;
    }
    return -1;
  };
  const idxNum = findCol(['Número', 'Numero', 'OT', 'Nro']);
  const idxSum = findCol(['Suministro']);
  const idxDir = findCol(['Direccion Consumo', 'Dirección Consumo', 'Direccion', 'Dirección', 'Domicilio']);
  const idxTit = findCol(['Titular', 'Cliente']);
  const idxTipo = findCol(['Tipo Orden', 'Tipo']);
  const idxMotivo = findCol(['Motivo Orden', 'Motivo']);
  const idxEstado = findCol(['Estado']);
  const idxGeo = findCol(['Punto GEO', 'Geo', 'Coordenadas']);
  const idxPrio = findCol(['Posee Priorid.', 'Posee Prioridad', 'Prioridad', 'Prio']);
  const idxOperario = findCol(['Operario']); // <-- NUEVO: columna Operario
  const tasks = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(sep).map(c => c.trim());
    if (cols.length < 2) continue;
    const geoStr = idxGeo >= 0 ? cols[idxGeo] : '';
    const coords = convertGarmin(geoStr);
    if (!coords) continue;
    let prioridad = 'Media';
    if (idxPrio >= 0) {
      const prioVal = cols[idxPrio] || '';
      if (/Si|Alta|Sí/i.test(prioVal)) prioridad = 'Alta';
      else if (/No|Baja/i.test(prioVal)) prioridad = 'Baja';
    }
    let status = 'Pendiente';
    if (idxEstado >= 0) {
      const estadoVal = cols[idxEstado] || '';
      if (/Completada|Finalizada|Realizada/i.test(estadoVal)) status = 'Completada';
      else if (/Rechazada|Cancelada/i.test(estadoVal)) status = 'Rechazada';
      else if (/Progreso|En Curso/i.test(estadoVal)) status = 'EnProgreso';
    }
    const numeroOT = (idxNum >= 0 && cols[idxNum]) ? cols[idxNum] : `OT-${i}`;
    const operario = (idxOperario >= 0 && cols[idxOperario]) ? cols[idxOperario] : '';
    tasks.push({
      lat: coords.lat, lon: coords.lon, numeroOT: numeroOT,
      suministro: idxSum >= 0 ? cols[idxSum] : '',
      direccion: idxDir >= 0 ? cols[idxDir] : '',
      titular: idxTit >= 0 ? cols[idxTit] : '',
      tipoTarea: idxTipo >= 0 ? cols[idxTipo] : 'Orden',
      observaciones: idxMotivo >= 0 ? cols[idxMotivo] : '',
      prioridad: prioridad, status: status,
      operario: operario, // <-- NUEVO
      isGeneric: false
    });
  }
  return tasks;
}

// ========== EXPORTAR CSV (con apellido del operario) ==========
function exportCSV() {
  if (!tasks.length) { alert('No hay tareas para exportar.'); return; }
  
  // Obtener apellido del operario (desde el campo 'operario' de la primera tarea que lo tenga)
  let apellido = '';
  for (const t of tasks) {
    if (t.operario && t.operario.trim() !== '') {
      const partes = t.operario.trim().split(' ');
      if (partes.length > 0) {
        apellido = partes[0]; // Tomar el primer nombre (ej. "Guzman")
        break;
      }
    }
  }
  // Si no se encontró, preguntar
  if (!apellido) {
    const input = prompt('Ingresá el apellido del operario para el nombre del archivo:', 'Guzman');
    if (input && input.trim() !== '') apellido = input.trim();
    else apellido = 'Operario';
  }
  
  const now = new Date();
  const dia = String(now.getDate()).padStart(2, '0');
  const mes = String(now.getMonth() + 1).padStart(2, '0');
  const anio = String(now.getFullYear()).slice(2);
  const horas = String(now.getHours()).padStart(2, '0');
  const minutos = String(now.getMinutes()).padStart(2, '0');
  const nombreArchivo = `${apellido}${dia}${mes}${anio}_${horas}_${minutos}.txt`;
  
  const headers = [
    'Número', 'Suministro', 'Direccion Consumo', 'Titular', 
    'Tipo Orden', 'Motivo Orden', 'Estado', 'Punto GEO', 'Posee Priorid.'
  ];
  let csv = headers.join('\t') + '\n';
  
  tasks.forEach(t => {
    const geoStr = toGarminFormat(t.lat, t.lon);
    const row = [
      t.numeroOT,
      t.suministro,
      t.direccion || '',
      t.titular || '',
      t.tipoTarea || 'Orden',
      t.observaciones || '',
      t.status || 'Pendiente',
      geoStr,
      t.prioridad === 'Alta' ? 'Si' : (t.prioridad === 'Baja' ? 'No' : 'No')
    ];
    csv += row.join('\t') + '\n';
  });

  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = nombreArchivo;
  link.click();
  showToast(`📤 Archivo exportado: ${nombreArchivo}`);
}

// ========== PEGAR DESDE PORTAPAPELES ==========
async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast('❌ No se pudo leer el portapapeles');
      return;
    }
    const rawTasks = parseOrdenesTXT(text);
    if (!rawTasks || rawTasks.length === 0) {
      showToast('❌ No se encontraron tareas válidas en el portapapeles');
      return;
    }
    modoLectura = false;
    tasks = rawTasks;
    tasks.forEach(t => {
      if (!t.status) t.status = 'Pendiente';
      if (!t.prioridad) t.prioridad = 'Media';
      if (!t.tipoTarea) t.tipoTarea = 'Orden';
      if (t.isGeneric === undefined) t.isGeneric = false;
    });
    perfilRuteo = 'driving';
    document.getElementById('profile-select').value = perfilRuteo;
    origenPersonalizado = null;
    lastReorderLatLng = userLatLng ? [userLatLng[0], userLatLng[1]] : null;
    loadProgress();
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('hud-panel').style.display = 'flex';
    document.getElementById('modalTitle').innerHTML = '📋 Lista de Trabajos <span id="modalTotal">(0)</span>';
    await reorderTasks();
    fitMapToFeatures();
    showToast(`✅ ${tasks.length} tareas cargadas desde el portapapeles`);
  } catch (e) {
    console.error('Error al pegar:', e);
    showToast('❌ Error al leer el portapapeles. Asegúrate de permitir el acceso.');
  }
}

  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('totalCount').textContent = '0';
  document.getElementById('modalTotal').textContent = '(0)';
  document.getElementById('taskListContainer').innerHTML = '';
  showToast('🧹 Todo limpiado correctamente');
}
